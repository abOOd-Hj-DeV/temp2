services:
  app:
    build: .
    image: sakina-api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "php", "artisan", "ops:health", "app"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [app, reverb]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/ready"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  migrate:
    image: sakina-api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    entrypoint: ["php", "artisan"]
    command: ["migrate", "--force"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  queue:
    image: sakina-api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30", "--timeout=60", "--max-time=3600"]
    healthcheck:
      test: ["CMD", "php", "artisan", "ops:health", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on: [app]
    restart: unless-stopped

  scheduler:
    image: sakina-api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "artisan", "ops:health", "scheduler"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    depends_on: [app]
    restart: unless-stopped

  reverb:
    image: sakina-api
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on: [app]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sakina}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
